<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreshMart Admin Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #10b981;
      --primary-dark: #059669;
      --secondary: #14b8a6;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --info: #3b82f6;
      --bg-gradient: linear-gradient(135deg, #10b981 0%, #14b8a6 100%);
      --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      --card-hover: 0 15px 40px rgba(0, 0, 0, 0.15);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      padding: 24px;
      color: #1f2937;
    }

    .dashboard-container {
      max-width: 1400px;
      margin: 0 auto;
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Header */
    .dashboard-header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 32px;
      margin-bottom: 24px;
      box-shadow: var(--card-shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-content h1 {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .header-subtitle {
      color: #6b7280;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ecfdf5;
      color: var(--success);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }

    .header-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    }

    .btn-outline {
      background: white;
      color: var(--primary);
      border: 2px solid var(--primary);
    }

    .btn-outline:hover {
      background: var(--primary);
      color: white;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--card-shadow);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(180deg, var(--primary), var(--secondary));
    }

    .stat-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--card-hover);
    }

    .stat-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(20, 184, 166, 0.1));
    }

    .stat-label {
      color: #6b7280;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 36px;
      font-weight: 800;
      background: linear-gradient(135deg, #1f2937, #374151);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }

    .stat-change {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .stat-change.positive {
      color: var(--success);
    }

    .stat-change.negative {
      color: var(--danger);
    }

    /* Tabs */
    .tabs-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      box-shadow: var(--card-shadow);
      overflow: hidden;
    }

    .tabs-header {
      display: flex;
      gap: 4px;
      padding: 16px;
      background: #f9fafb;
      border-bottom: 1px solid #e5e7eb;
    }

    .tab-button {
      flex: 1;
      padding: 12px 24px;
      border: none;
      background: transparent;
      color: #6b7280;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tab-button:hover {
      background: rgba(16, 185, 129, 0.1);
      color: var(--primary);
    }

    .tab-button.active {
      background: white;
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .tab-content {
      display: none;
      padding: 0;
      animation: fadeIn 0.4s ease-out;
      width: 100%;
    }

    .tab-content.active {
      display: block;
      width: 100%;
    }


    /* Table */
    .table-container {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      width: 100%;
    }

    table {
      width: 100%;
      min-width: 100%;
      border-collapse: collapse;
      table-layout: auto;
    }

    thead {
      background: #f9fafb;
      border-bottom: 2px solid #e5e7eb;
    }

    th {
      text-align: left;
      padding: 16px 12px;
      color: #374151;
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    td {
      padding: 16px 12px;
      border-bottom: 1px solid #f3f4f6;
      color: #1f2937;
      font-size: 14px;
      vertical-align: middle;
    }

    tr:hover {
      background: #f9fafb;
    }

    tr:last-child td {
      border-bottom: none;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-completed {
      background: #d1fae5;
      color: #047857;
    }

    .badge-processing {
      background: #dbeafe;
      color: #1e40af;
    }

    .badge-pending {
      background: #fef3c7;
      color: #92400e;
    }

    .badge-incomplete {
      background: #f3f4f6;
      color: #4b5563;
    }

    .badge-canceled {
      background: #fee2e2;
      color: #991b1b;
    }

    .badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }

    .empty-state-icon {
      font-size: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-state-text {
      color: #6b7280;
      font-size: 16px;
      margin-bottom: 8px;
    }

    .empty-state-subtext {
      color: #9ca3af;
      font-size: 14px;
    }

    /* Loading */
    .loading-spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid #f3f4f6;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      gap: 16px;
    }

    .loading-text {
      color: #6b7280;
      font-size: 14px;
    }

    /* Price */
    .price {
      font-weight: 700;
      color: #059669;
      font-size: 15px;
    }

    /* Stock Status */
    .stock-high { color: var(--success); font-weight: 700; }
    .stock-medium { color: var(--warning); font-weight: 700; }
    .stock-low { color: var(--danger); font-weight: 700; }

    /* Tooltips */
    [data-tooltip] {
      position: relative;
      cursor: help;
    }

    [data-tooltip]:hover::before {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 12px;
      background: #1f2937;
      color: white;
      font-size: 12px;
      border-radius: 6px;
      white-space: nowrap;
      z-index: 1000;
      margin-bottom: 8px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      body {
        padding: 12px;
      }

      .dashboard-header {
        padding: 20px;
      }

      .header-content h1 {
        font-size: 24px;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }

      .tabs-header {
        flex-direction: column;
      }

      .tab-button {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <!-- Header -->
    <header class="dashboard-header">
      <div class="header-content">
        <h1>🏪 FreshMart Admin Dashboard</h1>
        <div class="header-subtitle">
          <span>Universal Commerce Protocol (UCP) Seller Platform</span>
          <span class="status-indicator">
            <span class="status-dot"></span>
            Live
          </span>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn btn-outline" onclick="refreshAll()">
          🔄 Refresh All
        </button>
        <button class="btn btn-primary" onclick="exportData()">
          📊 Export Data
        </button>
      </div>
    </header>

    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-header">
          <div>
            <div class="stat-label">Total Revenue</div>
            <div class="stat-value" id="totalRevenue">$0.00</div>
            <div class="stat-change positive" id="revenueChange">
              ↗ +0% from last period
            </div>
          </div>
          <div class="stat-icon">💰</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-header">
          <div>
            <div class="stat-label">Total Orders</div>
            <div class="stat-value" id="totalOrders">-</div>
            <div class="stat-change positive" id="ordersChange">
              ↗ +0% this week
            </div>
          </div>
          <div class="stat-icon">📦</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-header">
          <div>
            <div class="stat-label">Active Checkouts</div>
            <div class="stat-value" id="totalCheckouts">-</div>
            <div class="stat-change" id="checkoutsChange">
              → 0 pending completion
            </div>
          </div>
          <div class="stat-icon">🛒</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-header">
          <div>
            <div class="stat-label">Products</div>
            <div class="stat-value" id="totalProducts">-</div>
            <div class="stat-change" id="productsChange">
              → 0 low stock items
            </div>
          </div>
          <div class="stat-icon">📊</div>
        </div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs-container">
      <div class="tabs-header">
        <button class="tab-button active" onclick="showTab('orders')">
          📦 Orders
        </button>
        <button class="tab-button" onclick="showTab('checkouts')">
          🛒 Checkouts
        </button>
        <button class="tab-button" onclick="showTab('inventory')">
          📊 Inventory
        </button>
      </div>

      <!-- Orders Tab -->
      <div id="orders-tab" class="tab-content active">
        <div id="orders-content" class="loading-container">
          <div class="loading-spinner"></div>
          <div class="loading-text">Loading orders...</div>
        </div>
      </div>

      <!-- Checkouts Tab -->
      <div id="checkouts-tab" class="tab-content">
        <div id="checkouts-content" class="loading-container">
          <div class="loading-spinner"></div>
          <div class="loading-text">Loading checkouts...</div>
        </div>
      </div>

      <!-- Inventory Tab -->
      <div id="inventory-tab" class="tab-content">
        <div id="inventory-content" class="loading-container">
          <div class="loading-spinner"></div>
          <div class="loading-text">Loading inventory...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000';
    let ordersData = [];
    let checkoutsData = [];
    let inventoryData = [];

    // Tab Management
    function showTab(tabName) {
      document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      event.target.classList.add('active');
      document.getElementById(`${tabName}-tab`).classList.add('active');
    }

    // Status Badge
    function getStatusBadge(status) {
      const statusLower = status.toLowerCase();
      const badges = {
        completed: 'badge-completed',
        processing: 'badge-processing',
        pending: 'badge-pending',
        incomplete: 'badge-incomplete',
        canceled: 'badge-canceled'
      };

      for (const [key, className] of Object.entries(badges)) {
        if (statusLower.includes(key)) {
          return `<span class="badge ${className}">${status}</span>`;
        }
      }
      return `<span class="badge badge-incomplete">${status}</span>`;
    }

    // Formatting
    function formatPrice(cents) {
      return `$${(cents / 100).toFixed(2)}`;
    }

    function formatDate(dateStr) {
      if (!dateStr) return 'N/A';
      const date = new Date(dateStr);
      return date.toLocaleString('en-US', {
        month: 'short',
        day: 'numeric',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    // Load Orders
    async function loadOrders() {
      try {
        const response = await fetch(`${API_BASE}/admin/orders`);
        const data = await response.json();

        ordersData = data.orders || [];
        document.getElementById('totalOrders').textContent = data.count || 0;

        // Calculate revenue
        let totalRevenue = 0;
        ordersData.forEach(order => {
          const totalObj = order.totals?.find(t => t.type === 'total');
          totalRevenue += (totalObj?.amount || 0);
        });
        document.getElementById('totalRevenue').textContent = formatPrice(totalRevenue);

        const content = document.getElementById('orders-content');

        if (ordersData.length === 0) {
          content.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">📦</div>
              <div class="empty-state-text">No orders yet</div>
              <div class="empty-state-subtext">Orders will appear here once customers complete purchases</div>
            </div>
          `;
          return;
        }

        renderOrdersTable(ordersData);
      } catch (error) {
        document.getElementById('orders-content').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">⚠️</div>
            <div class="empty-state-text">Error loading orders</div>
            <div class="empty-state-subtext">${error.message}</div>
          </div>
        `;
      }
    }

    function renderOrdersTable(orders) {
      let html = `
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Buyer</th>
                <th>Items</th>
                <th>Total</th>
                <th>Status</th>
                <th>Created</th>
              </tr>
            </thead>
            <tbody>
      `;

      orders.forEach(order => {
        const buyerEmail = order.buyer?.email || 'N/A';
        const buyerName = order.buyer?.name || '';
        const itemsCount = order.line_items?.length || 0;
        const totalObj = order.totals?.find(t => t.type === 'total');
        const total = totalObj?.amount || 0;
        const status = order.status || 'unknown';

        html += `
          <tr>
            <td>
              <strong>${order.id.substring(0, 12)}...</strong>
            </td>
            <td>
              ${buyerName ? `<strong>${buyerName}</strong><br>` : ''}
              <small style="color: #6b7280;">${buyerEmail}</small>
            </td>
            <td>${itemsCount} item${itemsCount !== 1 ? 's' : ''}</td>
            <td class="price">${formatPrice(total)}</td>
            <td>${getStatusBadge(status)}</td>
            <td><small>${formatDate(order.created_at)}</small></td>
          </tr>
        `;
      });

      html += '</tbody></table></div>';
      document.getElementById('orders-content').innerHTML = html;
    }

    // Load Checkouts
    async function loadCheckouts() {
      try {
        const response = await fetch(`${API_BASE}/admin/checkouts`);
        const data = await response.json();

        checkoutsData = data.checkouts || [];
        document.getElementById('totalCheckouts').textContent = data.count || 0;

        const content = document.getElementById('checkouts-content');

        if (checkoutsData.length === 0) {
          content.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">🛒</div>
              <div class="empty-state-text">No checkout sessions</div>
              <div class="empty-state-subtext">Active shopping sessions will appear here</div>
            </div>
          `;
          return;
        }

        renderCheckoutsTable(checkoutsData);
      } catch (error) {
        document.getElementById('checkouts-content').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">⚠️</div>
            <div class="empty-state-text">Error loading checkouts</div>
            <div class="empty-state-subtext">${error.message}</div>
          </div>
        `;
      }
    }

    function renderCheckoutsTable(checkouts) {
      let html = `
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Session ID</th>
                <th>Buyer</th>
                <th>Items</th>
                <th>Total</th>
                <th>Status</th>
                <th>Created</th>
              </tr>
            </thead>
            <tbody>
      `;

      checkouts.forEach(checkout => {
        const buyerEmail = checkout.buyer?.email || 'N/A';
        const buyerName = checkout.buyer?.name || '';
        const itemsCount = checkout.line_items?.length || 0;
        const totalObj = checkout.totals?.find(t => t.type === 'total');
        const total = totalObj?.amount || 0;
        const status = checkout.status || 'unknown';

        html += `
          <tr>
            <td>
              <strong>${checkout.id.substring(0, 12)}...</strong>
            </td>
            <td>
              ${buyerName ? `<strong>${buyerName}</strong><br>` : ''}
              <small style="color: #6b7280;">${buyerEmail}</small>
            </td>
            <td>${itemsCount} item${itemsCount !== 1 ? 's' : ''}</td>
            <td class="price">${formatPrice(total)}</td>
            <td>${getStatusBadge(status)}</td>
            <td><small>${formatDate(checkout.created_at)}</small></td>
          </tr>
        `;
      });

      html += '</tbody></table></div>';
      document.getElementById('checkouts-content').innerHTML = html;
    }

    // Load Inventory
    async function loadInventory() {
      try {
        const response = await fetch(`${API_BASE}/admin/inventory`);
        const data = await response.json();

        inventoryData = data.inventory || [];
        document.getElementById('totalProducts').textContent = data.count || 0;

        // Count low stock items
        const lowStockCount = inventoryData.filter(item => item.quantity < 10).length;
        document.getElementById('productsChange').textContent = `→ ${lowStockCount} low stock items`;

        const content = document.getElementById('inventory-content');

        if (inventoryData.length === 0) {
          content.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">📊</div>
              <div class="empty-state-text">No inventory data</div>
              <div class="empty-state-subtext">Product inventory will appear here</div>
            </div>
          `;
          return;
        }

        renderInventoryTable(inventoryData);
      } catch (error) {
        document.getElementById('inventory-content').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">⚠️</div>
            <div class="empty-state-text">Error loading inventory</div>
            <div class="empty-state-subtext">${error.message}</div>
          </div>
        `;
      }
    }

    function renderInventoryTable(inventory) {
      let html = `
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Product ID</th>
                <th>Product Name</th>
                <th>Price</th>
                <th>Stock Quantity</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
      `;

      inventory.forEach(item => {
        let stockClass = 'stock-high';
        let stockStatus = 'In Stock';

        if (item.quantity <= 0) {
          stockClass = 'stock-low';
          stockStatus = 'Out of Stock';
        } else if (item.quantity < 10) {
          stockClass = 'stock-medium';
          stockStatus = 'Low Stock';
        }

        html += `
          <tr>
            <td><strong>${item.product_id}</strong></td>
            <td>${item.product_title}</td>
            <td class="price">${formatPrice(item.product_price)}</td>
            <td class="${stockClass}"><strong>${item.quantity}</strong></td>
            <td><span class="badge ${item.quantity > 10 ? 'badge-completed' : item.quantity > 0 ? 'badge-pending' : 'badge-canceled'}">${stockStatus}</span></td>
          </tr>
        `;
      });

      html += '</tbody></table></div>';
      document.getElementById('inventory-content').innerHTML = html;
    }

    // Refresh All
    function refreshAll() {
      loadOrders();
      loadCheckouts();
      loadInventory();
    }

    // Export Data
    function exportData() {
      const data = {
        exported_at: new Date().toISOString(),
        orders: ordersData,
        checkouts: checkoutsData,
        inventory: inventoryData
      };

      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `freshmart-export-${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // Initialize
    window.onload = () => {
      loadOrders();
      loadCheckouts();
      loadInventory();

      // Auto-refresh every 30 seconds
      setInterval(refreshAll, 30000);
    };
  </script>
</body>
</html>
